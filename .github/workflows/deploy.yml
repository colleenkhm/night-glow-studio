name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/"

      # GitHub Pages has no server-side rewrites, so a direct visit/refresh on
      # a path like /studio would 404 now that the app uses path-based URLs
      # instead of a hash. GitHub Pages serves 404.html for any unmatched
      # path, so making it an identical copy of index.html lets the Flutter
      # app boot up as normal and route itself based on the URL.
      - name: Add 404 fallback for client-side routing
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          keep_files: true
